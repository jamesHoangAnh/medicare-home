<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              medical: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                500: "#0ea5e9",
                600: "#0284c7",
              },
              teal: { 500: "#14b8a6", 600: "#0d9488" },
            },
          },
        },
      };
    </script>
    <style>
      .fade-in {
        animation: fadeIn 0.3s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .sidebar-link.active {
        background-color: #e0f2fe;
        color: #0284c7;
        border-right: 3px solid #0284c7;
      }
      .input-error {
        border-color: #ef4444 !important;
        background-color: #fef2f2;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans">
    <!-- AUTH SCREEN -->
    <div
      id="authScreen"
      class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-medical-50 to-teal-50"
    >
      <div
        class="bg-white rounded-2xl shadow-xl overflow-hidden max-w-4xl w-full grid md:grid-cols-2"
      >
        <div
          class="bg-gradient-to-br from-medical-600 to-teal-600 p-8 text-white flex flex-col justify-center"
        >
          <div class="flex items-center gap-3 mb-6">
            <div
              class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center"
            >
              <i class="fas fa-heartbeat text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold">MediCare Home</h1>
          </div>
          <h2 class="text-xl font-semibold mb-3">Chăm sóc sức khỏe tại nhà</h2>
          <ul class="space-y-2 text-sm text-medical-100">
            <li>
              <i class="fas fa-check-circle mr-2"></i>Tư vấn Video Call 24/7
            </li>
            <li>
              <i class="fas fa-check-circle mr-2"></i>Đặt lịch khám tại nhà
            </li>
            <li><i class="fas fa-check-circle mr-2"></i>Thanh toán VietQR</li>
          </ul>
        </div>
        <div class="p-8 md:p-10">
          <div id="loginView">
            <h2 class="text-2xl font-bold mb-2">Đăng nhập</h2>
            <div class="space-y-4 mt-6">
              <input
                id="loginPhone"
                type="tel"
                placeholder="Số điện thoại"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl"
              />
              <input
                id="loginPass"
                type="password"
                placeholder="Mật khẩu"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl"
              />
              <div
                id="loginError"
                class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-sm"
              ></div>
              <button
                onclick="handleLogin()"
                class="w-full py-3 bg-gradient-to-r from-medical-600 to-teal-600 text-white rounded-xl font-semibold"
              >
                Đăng nhập
              </button>
            </div>
            <div class="mt-6 pt-6 border-t text-center">
              <p class="text-sm text-gray-600">
                Chưa có tài khoản?
                <button
                  onclick="showRegister()"
                  class="text-medical-600 font-semibold"
                >
                  Đăng ký ngay
                </button>
              </p>
              <div class="mt-4 grid grid-cols-2 gap-2">
                <button
                  onclick="quickLogin('0901111001')"
                  class="text-xs py-2 bg-medical-50 text-medical-700 rounded-lg"
                >
                  👤 Bệnh nhân
                </button>
                <button
                  onclick="quickLogin('0901111002')"
                  class="text-xs py-2 bg-teal-50 text-teal-700 rounded-lg"
                >
                  💬 Tư vấn viên
                </button>
                <button
                  onclick="quickLogin('0901111003')"
                  class="text-xs py-2 bg-emerald-50 text-emerald-700 rounded-lg"
                >
                  👨‍⚕️ Bác sĩ
                </button>
                <button
                  onclick="quickLogin('0901111000')"
                  class="text-xs py-2 bg-purple-50 text-purple-700 rounded-lg"
                >
                  ⚙️ Admin
                </button>
              </div>
            </div>
          </div>
          <div id="registerView" class="hidden">
            <div class="flex items-center gap-2 mb-4">
              <button onclick="showLogin()" class="text-gray-500">
                <i class="fas fa-arrow-left"></i>
              </button>
              <h2 class="text-2xl font-bold">Đăng ký</h2>
            </div>
            <div class="space-y-4">
              <input
                id="regName"
                type="text"
                placeholder="Họ và tên *"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl"
              />
              <input
                id="regPhone"
                type="tel"
                placeholder="Số điện thoại *"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl"
              />
              <input
                id="regEmail"
                type="email"
                placeholder="Email"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl"
              />
              <input
                id="regPass"
                type="password"
                placeholder="Mật khẩu * (≥8 ký tự, chữ hoa & số)"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl"
              />
              <div
                id="regError"
                class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-sm"
              ></div>
              <button
                onclick="handleRegister()"
                class="w-full py-3 bg-gradient-to-r from-medical-600 to-teal-600 text-white rounded-xl font-semibold"
              >
                Đăng ký
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col md:flex-row">
      <aside
        class="w-64 bg-white shadow-xl flex-col fixed h-full z-20 hidden md:flex"
      >
        <div class="p-6 border-b flex items-center gap-3">
          <div
            class="w-10 h-10 bg-gradient-to-br from-medical-600 to-teal-600 rounded-xl flex items-center justify-center text-white"
          >
            <i class="fas fa-heartbeat"></i>
          </div>
          <div>
            <h1 class="font-bold text-sm">MediCare Home</h1>
            <p id="sidebarRole" class="text-xs text-gray-500">Vai trò</p>
          </div>
        </div>
        <nav id="sidebarMenu" class="flex-1 p-4 space-y-1"></nav>
        <div class="p-4 border-t">
          <div class="flex items-center gap-3 mb-3 p-2 bg-gray-50 rounded-xl">
            <div
              id="userAvatar"
              class="w-10 h-10 rounded-full bg-medical-100 text-medical-700 flex items-center justify-center font-bold"
            >
              U
            </div>
            <div>
              <p id="userName" class="font-semibold text-sm">User</p>
              <p id="userPhone" class="text-xs text-gray-500">090...</p>
            </div>
          </div>
          <button
            onclick="logout()"
            class="w-full py-2 text-sm text-red-600 hover:bg-red-50 rounded-xl"
          >
            <i class="fas fa-sign-out-alt mr-2"></i>Đăng xuất
          </button>
        </div>
      </aside>
      <main class="flex-1 md:ml-64 flex flex-col min-h-screen pb-20 md:pb-0">
        <header
          class="hidden md:flex bg-white shadow-sm px-6 py-4 items-center justify-between"
        >
          <div>
            <h2 id="pageTitle" class="text-xl font-bold">Dashboard</h2>
            <p id="pageSubtitle" class="text-sm text-gray-500">Tổng quan</p>
          </div>
        </header>
        <div
          id="contentArea"
          class="flex-1 p-4 md:p-6 overflow-y-auto fade-in"
        ></div>
      </main>
      <nav
        id="bottomNav"
        class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center py-2 z-30"
      ></nav>
    </div>

    <!-- MODAL -->
    <div
      id="modal"
      class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto"
        id="modalContent"
      ></div>
    </div>
    <!-- TOAST -->
    <div
      id="toast"
      class="hidden fixed top-6 right-6 z-[100] bg-white shadow-2xl rounded-xl p-4 flex items-center gap-3 border-l-4 max-w-sm transition-all duration-300 transform translate-x-full"
    >
      <i id="toastIcon" class="fas fa-check-circle text-xl text-emerald-500"></i
      ><span id="toastMsg" class="text-sm font-medium">Thông báo</span>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
      let currentUser = null;
      const roleNames = {
        Admin: "Quản trị viên",
        BacSi: "Bác sĩ",
        TuVanVien: "Tư vấn viên",
        BenhNhan: "Bệnh nhân",
      };
      const menus = {
        BenhNhan: [
          { key: "dashboard", icon: "home", label: "Tổng quan" },
          { key: "yeuCau", icon: "comments", label: "Yêu cầu tư vấn" },
          { key: "datLich", icon: "calendar-plus", label: "Đặt lịch" },
          { key: "lichKham", icon: "calendar-check", label: "Lịch khám" },
          { key: "benhAn", icon: "file-medical", label: "Bệnh án" },
          { key: "hoaDon", icon: "file-invoice-dollar", label: "Hóa đơn" },
          { key: "profile", icon: "user-circle", label: "Hồ sơ" },
        ],
        TuVanVien: [
          { key: "dashboard", icon: "home", label: "Tổng quan" },
          { key: "dieuPhoi", icon: "tasks", label: "Điều phối" },
          { key: "profile", icon: "user-circle", label: "Hồ sơ" },
        ],
        BacSi: [
          { key: "dashboard", icon: "home", label: "Tổng quan" },
          { key: "lichCho", icon: "clock", label: "Lịch chờ xác nhận" },
          {
            key: "lichKhamBS",
            icon: "calendar-alt",
            label: "Lịch khám của tôi",
          },
          { key: "benhAnBS", icon: "file-medical", label: "Bệnh án" },
          { key: "hoaDonBS", icon: "file-invoice", label: "Hóa đơn" },
          { key: "profile", icon: "user-circle", label: "Hồ sơ" },
        ],
        Admin: [
          { key: "dashboard", icon: "home", label: "Tổng quan" },
          { key: "quanLyTK", icon: "users", label: "Quản lý TK" },
          { key: "nhatKy", icon: "history", label: "Nhật ký" },
          { key: "thongKe", icon: "chart-bar", label: "Thống kê" },
          { key: "profile", icon: "user-circle", label: "Hồ sơ" },
        ],
      };
      const bottomNavItems = {
        BenhNhan: [
          { key: "dashboard", icon: "home", label: "Trang chủ" },
          { key: "datLich", icon: "calendar-plus", label: "Đặt lịch" },
          { key: "profile", icon: "user", label: "Hồ sơ" },
        ],
        TuVanVien: [
          { key: "dashboard", icon: "home", label: "Trang chủ" },
          { key: "dieuPhoi", icon: "tasks", label: "Điều phối" },
          { key: "profile", icon: "user", label: "Hồ sơ" },
        ],
        BacSi: [
          { key: "dashboard", icon: "home", label: "Trang chủ" },
          { key: "lichCho", icon: "calendar-check", label: "Lịch" },
          { key: "profile", icon: "user", label: "Hồ sơ" },
        ],
        Admin: [
          { key: "dashboard", icon: "home", label: "Trang chủ" },
          { key: "quanLyTK", icon: "users", label: "QL TK" },
          { key: "profile", icon: "user", label: "Hồ sơ" },
        ],
      };

      // AUTH
      function showRegister() {
        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("registerView").classList.remove("hidden");
        clearErrors();
      }
      function showLogin() {
        document.getElementById("registerView").classList.add("hidden");
        document.getElementById("loginView").classList.remove("hidden");
        clearErrors();
      }
      function clearErrors() {
        document
          .querySelectorAll(".input-error")
          .forEach((el) => el.classList.remove("input-error"));
        document.getElementById("loginError")?.classList.add("hidden");
        document.getElementById("regError")?.classList.add("hidden");
      }
      function validateField(inputId, label) {
        const input = document.getElementById(inputId);
        if (!input.value.trim()) {
          input.classList.add("input-error");
          showToast(`Vui lòng nhập ${label}`, "error");
          input.focus();
          return false;
        }
        input.classList.remove("input-error");
        return true;
      }
      function quickLogin(sdt) {
        document.getElementById("loginPhone").value = sdt;
        document.getElementById("loginPass").value = "123456";
        handleLogin();
      }

      async function handleLogin() {
        clearErrors();
        if (!validateField("loginPhone", "Số điện thoại")) return;
        if (!validateField("loginPass", "Mật khẩu")) return;
        try {
          const data = await api.login(
            document.getElementById("loginPhone").value,
            document.getElementById("loginPass").value,
          );
          api.setAuth(data.token, data.user);
          currentUser = data.user;
          enterApp();
        } catch (err) {
          document.getElementById("loginError").textContent = err.message;
          document.getElementById("loginError").classList.remove("hidden");
        }
      }

      async function handleRegister() {
        clearErrors();
        if (!validateField("regName", "Họ và tên")) return;
        if (!validateField("regPhone", "Số điện thoại")) return;
        const pass = document.getElementById("regPass").value;
        if (!pass) {
          showToast("Vui lòng nhập mật khẩu", "error");
          document.getElementById("regPass").classList.add("input-error");
          return;
        }
        if (pass.length < 8 || !/[A-Z]/.test(pass) || !/[0-9]/.test(pass)) {
          showToast("Mật khẩu ≥8 ký tự, có chữ hoa và số", "error");
          document.getElementById("regPass").classList.add("input-error");
          return;
        }
        try {
          await api.register({
            hoTen: document.getElementById("regName").value.trim(),
            soDienThoai: document.getElementById("regPhone").value.trim(),
            email: document.getElementById("regEmail").value.trim(),
            matKhau: pass,
          });
          showToast("Đăng ký thành công!", "success");
          showLogin();
          document.getElementById("loginPhone").value =
            document.getElementById("regPhone").value;
        } catch (err) {
          document.getElementById("regError").textContent = err.message;
          document.getElementById("regError").classList.remove("hidden");
        }
      }

      function logout() {
        api.clearAuth();
        location.reload();
      }

      function enterApp() {
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("mainApp").classList.remove("hidden");
        document.getElementById("userName").textContent = currentUser.hoTen;
        document.getElementById("userPhone").textContent =
          currentUser.soDienThoai;
        document.getElementById("userAvatar").textContent =
          currentUser.hoTen.charAt(0);
        document.getElementById("sidebarRole").textContent =
          roleNames[currentUser.vaiTro];
        buildSidebar();
        buildBottomNav();
        navigate("dashboard");
      }

      function buildSidebar() {
        document.getElementById("sidebarMenu").innerHTML = menus[
          currentUser.vaiTro
        ]
          .map(
            (m) =>
              `<button onclick="navigate('${m.key}')" data-nav="${m.key}" class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-gray-600 hover:bg-medical-50 font-medium text-sm"><i class="fas fa-${m.icon} w-5 text-center"></i><span>${m.label}</span></button>`,
          )
          .join("");
      }
      function buildBottomNav() {
        const items = bottomNavItems[currentUser.vaiTro] || [];
        document.getElementById("bottomNav").innerHTML = items
          .map(
            (m) =>
              `<button onclick="navigate('${m.key}')" data-bnav="${m.key}" class="flex flex-col items-center gap-1 p-2 text-gray-500 hover:text-medical-600 flex-1"><i class="fas fa-${m.icon} text-xl"></i><span class="text-[10px] font-medium">${m.label}</span></button>`,
          )
          .join("");
      }

      async function navigate(page) {
        document
          .querySelectorAll(".sidebar-link, [data-bnav]")
          .forEach((el) => el.classList.remove("active", "text-medical-600"));
        document
          .querySelectorAll(`[data-nav="${page}"], [data-bnav="${page}"]`)
          .forEach((el) => {
            el.classList.add("active");
            if (el.hasAttribute("data-bnav"))
              el.classList.add("text-medical-600");
          });
        const content = document.getElementById("contentArea");
        content.classList.remove("fade-in");
        void content.offsetWidth;
        content.classList.add("fade-in");
        window.scrollTo(0, 0);
        try {
          switch (page) {
            case "dashboard":
              await renderDashboard();
              break;
            case "yeuCau":
              await renderYeuCau();
              break;
            case "datLich":
              await renderDatLich();
              break;
            case "lichKham":
              await renderLichKham();
              break;
            case "benhAn":
              await renderBenhAn();
              break;
            case "hoaDon":
              await renderHoaDon();
              break;
            case "dieuPhoi":
              await renderDieuPhoi();
              break;
            case "lichCho":
              await renderLichCho();
              break;
            case "lichKhamBS":
              await renderLichKhamBS();
              break;
            case "benhAnBS":
              await renderBenhAnBS();
              break;
            case "hoaDonBS":
              await renderHoaDonBS();
              break;
            case "quanLyTK":
              await renderQuanLyTK();
              break;
            case "nhatKy":
              await renderNhatKy();
              break;
            case "thongKe":
              await renderThongKe();
              break;
            case "profile":
              await renderProfile();
              break;
          }
        } catch (err) {
          content.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-xl">❌ Lỗi: ${err.message}</div>`;
        }
      }

      // DASHBOARD
      async function renderDashboard() {
        document.getElementById("pageTitle").textContent = "Tổng quan";
        document.getElementById("pageSubtitle").textContent =
          `Xin chào, ${currentUser.hoTen}!`;
        if (currentUser.vaiTro === "BenhNhan") {
          const [lich, hd] = await Promise.all([
            api.getMyAppointments(),
            api.getMyInvoices(),
          ]);
          const choTT = hd.filter((h) => h.trangThai === "ChoThanhToan").length;
          document.getElementById("contentArea").innerHTML =
            `<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6"><div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-medical-500"><p class="text-xs text-gray-500">Lịch khám</p><p class="text-2xl font-bold mt-1">${lich.length}</p></div><div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-amber-500"><p class="text-xs text-gray-500">Chờ TT</p><p class="text-2xl font-bold mt-1">${choTT}</p></div><div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-emerald-500 col-span-2 md:col-span-1"><p class="text-xs text-gray-500">Tổng HĐ</p><p class="text-2xl font-bold mt-1">${hd.length}</p></div></div><div class="bg-white rounded-2xl p-5 shadow-sm"><h3 class="font-bold mb-4 text-sm">Thao tác nhanh</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><button onclick="navigate('yeuCau')" class="p-4 bg-gradient-to-br from-medical-500 to-medical-600 text-white rounded-xl text-center"><i class="fas fa-comments text-2xl mb-2 block"></i><span class="text-xs">Tư vấn</span></button><button onclick="navigate('datLich')" class="p-4 bg-gradient-to-br from-teal-500 to-teal-600 text-white rounded-xl text-center"><i class="fas fa-calendar-plus text-2xl mb-2 block"></i><span class="text-xs">Đặt lịch</span></button><button onclick="navigate('benhAn')" class="p-4 bg-gradient-to-br from-purple-500 to-purple-600 text-white rounded-xl text-center"><i class="fas fa-file-medical text-2xl mb-2 block"></i><span class="text-xs">Bệnh án</span></button><button onclick="navigate('hoaDon')" class="p-4 bg-gradient-to-br from-amber-500 to-amber-600 text-white rounded-xl text-center"><i class="fas fa-qrcode text-2xl mb-2 block"></i><span class="text-xs">Thanh toán</span></button></div></div>`;
        } else if (currentUser.vaiTro === "Admin") {
          const stats = await api.getStatistics();
          document.getElementById("contentArea").innerHTML =
            `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"><div class="bg-white p-4 rounded-2xl shadow-sm"><p class="text-xs text-gray-500">Bệnh nhân</p><p class="text-xl md:text-2xl font-bold mt-1">${stats.soBenhNhan || 0}</p></div><div class="bg-white p-4 rounded-2xl shadow-sm"><p class="text-xs text-gray-500">Bác sĩ</p><p class="text-xl md:text-2xl font-bold mt-1">${stats.soBacSi || 0}</p></div><div class="bg-white p-4 rounded-2xl shadow-sm"><p class="text-xs text-gray-500">Doanh thu</p><p class="text-sm md:text-lg font-bold mt-1 text-emerald-600">${(stats.tongDoanhThu || 0).toLocaleString("vi-VN")}₫</p></div><div class="bg-white p-4 rounded-2xl shadow-sm"><p class="text-xs text-gray-500">YC chờ</p><p class="text-xl md:text-2xl font-bold mt-1 text-amber-600">${stats.yeuCauChoXuLy || 0}</p></div></div>`;
        } else if (currentUser.vaiTro === "BacSi") {
          const lich = await api.getDoctorPendingAppointments();
          document.getElementById("contentArea").innerHTML =

      async function doChangePassword() {
        const oldPass = document.getElementById("oldPass").value;
        const newPass = document.getElementById("newPass").value;
        const confirmPass = document.getElementById("confirmPass").value;
        if (!oldPass) return showToast("Nhập mật khẩu hiện tại", "error");
        if (!newPass) return showToast("Nhập mật khẩu mới", "error");
        if (
          newPass.length < 8 ||
          !/[A-Z]/.test(newPass) ||
          !/[0-9]/.test(newPass)
        )
          return showToast("MK mới ≥8 ký tự, có chữ hoa & số", "error");
        if (newPass !== confirmPass)
          return showToast("Mật khẩu xác nhận không khớp", "error");
        try {
          await api.changePassword(oldPass, newPass);
          showToast("Đổi mật khẩu thành công!", "success");
          document.getElementById("oldPass").value = "";
          document.getElementById("newPass").value = "";
          document.getElementById("confirmPass").value = "";

          showToast(err.message, "error");
        }
      }

      function fmtDT(v) {
        if (!v) return "—";
        const d = new Date(v);
        if (isNaN(d)) return String(v);
        const p = (n) => String(n).padStart(2, "0");
        return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }
      function fmtD(v) {
        if (!v) return "—";
        const d = new Date(v);
        if (isNaN(d)) return String(v);

        return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
      }
      function toLocalInput(v) {
        const d = new Date(v);
        if (isNaN(d)) return "";
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;

            <div class="w-10 h-10 bg-medical-100 text-medical-700 rounded-full flex items-center justify-center font-bold flex-shrink-0">${(l.tenBenhNhan || "B").charAt(0)}</div>
            <div class="min-w-0">
              <p class="font-bold text-sm truncate">${l.tenBenhNhan}</p>
              <p class="text-xs text-gray-500">${l.sdtBenhNhan || "—"}</p>
            </div>
          </div>
          ${badgeLich(l.trangThai)}
        </div>
        <div class="space-y-1 text-sm text-gray-700 mb-3">
          <p><i class="fas fa-clock text-medical-500 mr-2 w-4"></i>${fmtDT(l.thoiGian)}</p>
          <p><i class="fas fa-map-marker-alt text-medical-500 mr-2 w-4"></i>${l.diaChi || "—"}</p>
          ${l.ghiChu ? `<p><i class="fas fa-sticky-note text-amber-500 mr-2 w-4"></i>${l.ghiChu}</p>` : ""}
        </div>
        <div class="flex gap-2">${nut}</div>
      </div>`;
          })
          .join("");

        document.getElementById("contentArea").innerHTML = `
    <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm">
      <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
        ${tabs
          .map(
            ([k, t], i) => `
          <button onclick="locLichBS('${k}', this)" class="lich-tab px-3 py-1.5 ${i === 0 ? "bg-medical-600 text-white" : "bg-gray-100 text-gray-700"} rounded-full text-xs font-medium whitespace-nowrap">${t}</button>
        `,
          )
          .join("")}
      </div>
      <div id="dsLichBS">
        ${list.length === 0 ? '<p class="text-center text-gray-500 py-10"><i class="fas fa-calendar-times text-3xl mb-2 block"></i>Chưa có lịch khám nào</p>' : cards}
      </div>
    </div>`;
      }

      function locLichBS(tt, btn) {
        document.querySelectorAll(".lich-tab").forEach((b) => {
          b.classList.remove("bg-medical-600", "text-white");
          b.classList.add("bg-gray-100", "text-gray-700");
        });
        btn.classList.remove("bg-gray-100", "text-gray-700");
        btn.classList.add("bg-medical-600", "text-white");

        document.querySelectorAll(".lich-card").forEach((c) => {
          const s = c.dataset.tt;
          const hien =
            tt === "all" ||
            (tt === "DaHuy" ? s === "DaHuy" || s === "BSTuChoi" : s === tt);
          c.style.display = hien ? "" : "none";
        });
      }

      // ============ ĐỔI TRẠNG THÁI LỊCH (dùng chung) ============
      async function doiTrangThaiLich(id, trangThai, trangQuayLai) {
        const ten = (LICH_LABEL[trangThai] || [trangThai])[0];
        let lyDo = "";

        if (["DaHuy", "BSTuChoi"].includes(trangThai)) {
          lyDo = prompt(`Lý do ${ten.toLowerCase()} lịch khám #${id}:`, "");
          if (lyDo === null) return; // bấm Cancel
        } else {
          if (!confirm(`Xác nhận chuyển lịch #${id} sang trạng thái "${ten}"?`))
            return;
        }

        try {
          await api.setAppointmentStatus(id, trangThai, lyDo);
          showToast(`Đã cập nhật: ${ten}`, "success");
          navigate(trangQuayLai || "lichKham");
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      // ============ CHỈNH SỬA LỊCH KHÁM (Hình 111) ============
      let __lichDangSua = null;
      async function moSuaLich(id) {
        try {
          // Lấy lịch từ API phù hợp với vai trò
          const ds =
            currentUser.vaiTro === "BacSi"
              ? await api.getDoctorAppointments()
              : await api.getMyAppointments();
          const l = ds.find((x) => x.id === id);
          if (!l) return showToast("Không tìm thấy lịch khám", "error");
          __lichDangSua = l;

          document.getElementById("modalContent").innerHTML = `
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold">Sửa lịch khám #${l.id}</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
      </div>
      <div class="bg-medical-50 rounded-xl p-3 text-sm mb-4">
        <p><strong>Bệnh nhân:</strong> ${l.tenBenhNhan || "—"}</p>
        <p><strong>Bác sĩ:</strong> ${l.tenBacSi || currentUser.hoTen}</p>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-medium text-gray-700 mb-1 block">Thời gian khám *</label>
          <input id="slTG" type="datetime-local" value="${toLocalInput(l.thoiGian)}" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-medical-500">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-700 mb-1 block">Địa chỉ khám *</label>
          <input id="slDC" type="text" value="${(l.diaChi || "").replace(/"/g, "&quot;")}" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-medical-500">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-700 mb-1 block">Ghi chú</label>
          <textarea id="slGC" rows="2" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-medical-500">${l.ghiChu || ""}</textarea>
        </div>
        <button onclick="luuSuaLich(${l.id})" class="w-full py-3 bg-gradient-to-r from-medical-600 to-teal-600 text-white rounded-xl font-semibold">
          <i class="fas fa-save mr-2"></i>Lưu thay đổi
        </button>
        <button onclick="closeModal()" class="w-full py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium">Hủy</button>
      </div>`;
          document.getElementById("modal").classList.remove("hidden");
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      async function luuSuaLich(id) {
        if (!validateField("slTG", "Thời gian khám")) return;
        if (!validateField("slDC", "Địa chỉ khám")) return;
        try {
          await api.updateAppointment(id, {
            thoiGian: document.getElementById("slTG").value,
            diaChi: document.getElementById("slDC").value.trim(),
            ghiChu: document.getElementById("slGC").value.trim(),
          });
          closeModal();
          showToast("Đã cập nhật lịch khám", "success");
          navigate(currentUser.vaiTro === "BacSi" ? "lichKhamBS" : "lichKham");
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      // UTILS
      function closeModal() {
        document.getElementById("modal").classList.add("hidden");
      }
      function showToast(msg, type = "success") {
        const t = document.getElementById("toast");
        const icon = document.getElementById("toastIcon");
        document.getElementById("toastMsg").textContent = msg;

        const base =
          "fixed top-6 right-4 md:right-6 z-[100] bg-white shadow-2xl rounded-xl p-4 " +
          "flex items-start gap-3 border-l-4 transition-all duration-300 transform ";

        if (type === "error") {
          icon.className =
            "fas fa-times-circle text-xl text-red-500 flex-shrink-0 mt-0.5";
          t.className = base + "border-red-500 max-w-md";
        } else if (type === "info") {
          icon.className =
            "fas fa-info-circle text-xl text-sky-500 flex-shrink-0 mt-0.5";
          t.className = base + "border-sky-500 max-w-md";
        } else {
          icon.className =
            "fas fa-check-circle text-xl text-emerald-500 flex-shrink-0 mt-0.5";
          t.className = base + "border-emerald-500 max-w-md";
        }

        t.classList.remove("translate-x-full");
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(
          () => t.classList.add("translate-x-full"),
          5000,
        );
      }

      window.addEventListener("DOMContentLoaded", () => {
        if (api.token && api.user) {
          currentUser = api.user;
          enterApp();
        }
      });
    </script>
  </body>
</html>
